<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Luiz Gabriel — Desenvolvimento de Software</title>
  <desc id="desc">Banner retangular preto e roxo com formas geométricas diagonais e uma janela de código.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08060D"/>
      <stop offset="1" stop-color="#171020"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A78BFA" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M760 0H1200V300H900L760 0Z" fill="#24113F" opacity=".85"/>
  <path d="M910 0H1200V300H1080L910 0Z" fill="url(#violet)" opacity=".18"/>
  <path d="M840 0L1015 300" stroke="#A78BFA" stroke-opacity=".28" stroke-width="2"/>
  <path d="M885 0L1060 300" stroke="#A78BFA" stroke-opacity=".15" stroke-width="1"/>
  <circle cx="1010" cy="150" r="100" fill="#8B5CF6" opacity=".17" filter="url(#glow)"/>

  <rect x="56" y="48" width="5" height="204" rx="2.5" fill="url(#violet)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="78" fill="#B794F4" font-size="14" letter-spacing="4">PORTFÓLIO • 2026</text>
    <text x="84" y="155" fill="#FFFFFF" font-size="58" font-weight="700" letter-spacing="-1">LUIZ GABRIEL</text>
    <rect x="88" y="178" width="82" height="4" rx="2" fill="#A78BFA"/>
    <text x="88" y="218" fill="#E9DDFB" font-size="19" letter-spacing="1.2">DESENVOLVIMENTO DE SOFTWARE</text>
    <text x="88" y="250" fill="#B794F4" font-size="14" letter-spacing="2">DSM  /  FATEC REGISTRO</text>
  </g>

  <g transform="translate(830 68)">
    <rect width="300" height="164" rx="12" fill="#0C0912" stroke="#8054C7" stroke-opacity=".8"/>
    <path d="M0 34H300" stroke="#8054C7" stroke-opacity=".45"/>
    <circle cx="19" cy="17" r="4" fill="#A78BFA"/>
    <circle cx="34" cy="17" r="4" fill="#6D28D9"/>
    <circle cx="49" cy="17" r="4" fill="#4C1D95"/>
    <text x="20" y="66" fill="#A78BFA" font-family="monospace" font-size="13">const</text>
    <text x="69" y="66" fill="#F3E8FF" font-family="monospace" font-size="13">developer = {</text>
    <text x="34" y="94" fill="#C4B5FD" font-family="monospace" font-size="13">learning: "DSM",</text>
    <text x="34" y="120" fill="#C4B5FD" font-family="monospace" font-size="13">tools: ["HTML", "CSS"]</text>
    <text x="20" y="146" fill="#A78BFA" font-family="monospace" font-size="13">};</text>
  </g>
</svg>
