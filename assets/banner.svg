<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Luiz Gabriel — Portfólio de desenvolvimento</title>
  <desc id="desc">Banner profissional minimalista em preto e roxo, com tipografia editorial e monograma geométrico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09080D"/>
      <stop offset=".62" stop-color="#100D17"/>
      <stop offset="1" stop-color="#1A1028"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset=".5" stop-color="#9B72E8"/>
      <stop offset="1" stop-color="#D8C4FF"/>
    </linearGradient>
    <radialGradient id="ambient" cx="78%" cy="48%" r="48%">
      <stop offset="0" stop-color="#7136B8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7136B8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C4A7FF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="320" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#microgrid)"/>
    <rect width="1200" height="320" fill="url(#ambient)"/>
    <path d="M790 -40L1030 360" stroke="#A78BFA" stroke-opacity=".10" stroke-width="1.5"/>
    <path d="M850 -40L1090 360" stroke="#A78BFA" stroke-opacity=".08" stroke-width="1.5"/>
    <path d="M920 -40L1160 360" stroke="#A78BFA" stroke-opacity=".06" stroke-width="1.5"/>
    <path d="M0 286H1200" stroke="#B794F4" stroke-opacity=".18"/>
    <rect x="64" y="62" width="4" height="194" rx="2" fill="url(#violet)"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="94" y="86" fill="#B99AEF" font-size="13" font-weight="600" letter-spacing="3.8">PORTFÓLIO • 2026</text>
      <text x="90" y="166" fill="#F7F4FB" font-size="66" font-weight="700" letter-spacing="-2.4">Luiz Gabriel</text>
      <rect x="94" y="190" width="76" height="3" rx="1.5" fill="url(#violet)"/>
      <text x="94" y="226" fill="#E7E0F0" font-size="18" font-weight="500" letter-spacing="1.8">DESENVOLVIMENTO DE SOFTWARE</text>
      <text x="94" y="258" fill="#A99AB9" font-size="14" font-weight="500" letter-spacing="2.2">DSM  /  FATEC REGISTRO  /  SP</text>
    </g>

    <g transform="translate(850 54)">
      <circle cx="154" cy="105" r="112" fill="#6D28D9" opacity=".12" filter="url(#soft)"/>
      <circle cx="154" cy="105" r="92" fill="none" stroke="#A78BFA" stroke-opacity=".22"/>
      <circle cx="154" cy="105" r="76" fill="none" stroke="#A78BFA" stroke-opacity=".42" stroke-dasharray="2 8"/>
      <path d="M154 13A92 92 0 0 1 246 105" fill="none" stroke="url(#violet)" stroke-width="3" stroke-linecap="round"/>
      <path d="M154 197A92 92 0 0 1 62 105" fill="none" stroke="#6D28D9" stroke-width="3" stroke-linecap="round"/>
      <rect x="94" y="45" width="120" height="120" rx="28" fill="#110D19" stroke="#A78BFA" stroke-opacity=".65"/>
      <path d="M122 76V135H151" fill="none" stroke="#F4EEFF" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M177 77C159 77 154 91 154 105C154 119 160 135 179 135C188 135 195 132 201 126V106H180" fill="none" stroke="url(#violet)" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="154" cy="13" r="4" fill="#D8C4FF"/>
      <circle cx="246" cy="105" r="4" fill="#A78BFA"/>
      <circle cx="62" cy="105" r="4" fill="#6D28D9"/>
    </g>

    <g fill="#C4A7FF">
      <circle cx="1110" cy="57" r="2" opacity=".8"/>
      <circle cx="1134" cy="80" r="1.5" opacity=".5"/>
      <circle cx="1088" cy="238" r="2" opacity=".65"/>
    </g>
    <path d="M760 286H1135" stroke="url(#violet)" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="21.25" fill="none" stroke="#A78BFA" stroke-opacity=".24" stroke-width="1.5"/>
</svg>