name: Generate purple contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate purple snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: MosKatiello
          outputs: |
            dist/snake.svg?color_snake=%23E9D5FF&color_dots=%230D0A12,%23231933,%23432C68,%237C3AED,%23B794F4

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
