name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: MosKatiello
          outputs: |
            dist/snake.svg?color_snake=%23E9D5FF&color_dots=%230D0A12,%23231933,%23432C68,%237C3AED,%23B794F4
            dist/snake-dark.svg?color_snake=%23E9D5FF&color_dots=%230D0A12,%23231933,%23432C68,%237C3AED,%23B794F4
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
